<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="18" y1="12" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c4759"/>
      <stop offset="0.55" stop-color="#303a49"/>
      <stop offset="1" stop-color="#252d39"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(30 24) rotate(46) scale(76)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4c7df" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b4c7df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back-square" x1="61" y1="56" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7c5f0"/>
      <stop offset="1" stop-color="#86abe2"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="128" height="128" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0c1016" flood-opacity="0.52"/>
    </filter>
    <filter id="front-shadow" x="26" y="23" width="77" height="79" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#101722" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#tile)"/>
    <rect x="9" y="9" width="110" height="110" rx="26" fill="none" stroke="#6b788b" stroke-width="2"/>
    <rect x="12" y="12" width="104" height="104" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#glow)"/>
  </g>

  <rect x="59" y="55" width="41" height="42" rx="6" fill="url(#back-square)" stroke="#b8d0f2" stroke-opacity="0.55"/>

  <g filter="url(#front-shadow)">
    <rect x="33" y="29" width="59" height="59" rx="12" fill="#303a49" stroke="#dce8f6" stroke-width="5"/>
    <rect x="38.5" y="34.5" width="48" height="48" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>
</svg>
